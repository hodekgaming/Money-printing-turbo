# Copy this file to config.toml (or just use the Settings panel in the web UI,
# which writes config.toml for you). Environment variables override these
# values: OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY,
# PEXELS_API_KEY, PIXABAY_API_KEY.

[llm]
# One of: openai, gemini, anthropic, deepseek, ollama, openai_compatible
provider = "openai"

openai_api_key = ""
openai_model = "gpt-4o-mini"

gemini_api_key = ""
gemini_model = "gemini-2.5-flash"

anthropic_api_key = ""
anthropic_model = "claude-sonnet-5-5"

deepseek_api_key = ""
deepseek_model = "deepseek-chat"

ollama_base_url = "http://localhost:11434/v1"
ollama_model = "llama3.1"

# Any other OpenAI-compatible endpoint (OpenRouter, Groq, LM Studio, ...)
compatible_base_url = ""
compatible_api_key = ""
compatible_model = ""

[materials]
# Free API keys: https://www.pexels.com/api/  and  https://pixabay.com/api/docs/
# Several keys may be listed; they are rotated to spread rate limits.
pexels_api_keys = []
pixabay_api_keys = []

[tts]
openai_tts_model = "gpt-4o-mini-tts"

[app]
# Optional HTTP(S) proxy used for all outbound requests, e.g. "http://127.0.0.1:7890"
proxy = ""
